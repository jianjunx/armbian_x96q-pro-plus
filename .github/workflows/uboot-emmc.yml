name: Build eMMC U-Boot blob

# Builds only the standalone eMMC bootloader (u-boot-sunxi-with-spl-emmc.bin)
# from pinned upstream sources. It does NOT assemble an SD image; that is
# image-release.yml. Use this to re-roll the eMMC SPL/U-Boot after changing
# revision-v3/uboot-emmc.patch, then write the blob to the eMMC user area at
# byte offset 8192 (sector 16).
#
# The blob is the exact counterpart of revision-v3/build-emmc-uboot.sh, which
# does the same job inside the local h728-image-build container. Keep the two
# in sync: same pinned commits, same patch, same config changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uboot-emmc.yml'
      - 'revision-v3/uboot-emmc.patch'
      - 'revision-v3/build-emmc-uboot.sh'
      - 'ci/uboot-emmc.sha256'

permissions:
  contents: read

concurrency:
  group: uboot-emmc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uboot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential crossbuild-essential-arm64 \
            ca-certificates curl device-tree-compiler git make patch perl \
            libssl-dev libgnutls28-dev uuid-dev \
            python3 python3-dev python3-setuptools python3-yaml \
            python3-jsonschema python3-pyelftools swig

      - name: Download pinned upstream sources
        env:
          UBOOT_COMMIT: b99f4a9e0778f4f402619d70976537d4833d7eab
          ATF_COMMIT: b5de74a685fb73b784e45bbbd18dd9a0c528d8b2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o u-boot.tar.gz \
            "https://github.com/apritzel/u-boot/archive/${UBOOT_COMMIT}.tar.gz"
          curl -fsSL --retry 3 -o atf.tar.gz \
            "https://github.com/jernejsk/arm-trusted-firmware/archive/${ATF_COMMIT}.tar.gz"
          mkdir -p src out
          tar -xzf u-boot.tar.gz -C src
          tar -xzf atf.tar.gz -C src
          test -d "src/u-boot-${UBOOT_COMMIT}"
          test -d "src/arm-trusted-firmware-${ATF_COMMIT}"
          sha256sum u-boot.tar.gz atf.tar.gz | tee out/source.sha256

      - name: Verify source hashes when pinned
        run: |
          if [[ -f ci/uboot-emmc.sha256 ]]; then
            sha256sum -c ci/uboot-emmc.sha256
          else
            echo '::warning::ci/uboot-emmc.sha256 is absent, so the source archives are not hash-pinned. Copy out/source.sha256 into ci/uboot-emmc.sha256 to pin them.'
          fi

      - name: Build BL31
        env:
          ATF_COMMIT: b5de74a685fb73b784e45bbbd18dd9a0c528d8b2
        run: |
          set -euo pipefail
          atf="$PWD/src/arm-trusted-firmware-${ATF_COMMIT}"
          make -C "$atf" -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- PLAT=sun55i_a523 bl31
          test -f "$atf/build/sun55i_a523/release/bl31.bin"
          cp "$atf/build/sun55i_a523/release/bl31.bin" "$PWD/bl31.bin"

      - name: Build the eMMC U-Boot blob
        env:
          UBOOT_COMMIT: b99f4a9e0778f4f402619d70976537d4833d7eab
        run: |
          set -euo pipefail
          uboot="$PWD/src/u-boot-${UBOOT_COMMIT}"
          cp "$PWD/bl31.bin" "$uboot/bl31.bin"
          make -C "$uboot" CROSS_COMPILE=aarch64-linux-gnu- x96q_pro_plus_defconfig
          cd "$uboot"
          patch -p1 < "$GITHUB_WORKSPACE/revision-v3/uboot-emmc.patch"
          scripts/config --set-val MMC_SUNXI_SLOT_EXTRA 2
          scripts/config --set-str IDENT_STRING ' H728 eMMC v3'
          scripts/config --enable OF_LIBFDT_OVERLAY
          # H728 / A523: cap CONFIG_SYS_MMC_MAX_BLK_COUNT at 1 for this blob.
          # Multi-block reads to the eMMC fail intermittently (a CMD18 never
          # raises command-done), while single-block reads never failed once.
          # mmc_bread() splits a request on b_max, so this keeps every request
          # on the path that works. U-Boot proper pays for it only in speed.
          scripts/config --set-val CONFIG_SYS_MMC_MAX_BLK_COUNT 1
          make CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- EXTRAVERSION=-h728-emmc-v3
          test "$(grep '^CONFIG_MMC_SUNXI_SLOT_EXTRA=' .config)" = CONFIG_MMC_SUNXI_SLOT_EXTRA=2
          test "$(grep '^CONFIG_SYS_MMC_MAX_BLK_COUNT=' .config)" = CONFIG_SYS_MMC_MAX_BLK_COUNT=1
          echo "UBOOT_DIR=$uboot" >>"$GITHUB_ENV"

      - name: Assert the U-Boot eMMC node and blob signature
        run: |
          set -uo pipefail
          dtb="$UBOOT_DIR/arch/arm/dts/sun55i-h728-x96qpro+.dtb"
          blob=out/u-boot-sunxi-with-spl-emmc.bin
          cp "$UBOOT_DIR/u-boot-sunxi-with-spl.bin" "$blob"
          cp "$UBOOT_DIR/.config" out/emmc-uboot.config
          fail=0
          check() {  # name actual expected
            if [[ "$2" = "$3" ]]; then
              echo "OK   $1 = $2"
            else
              echo "FAIL $1 = '$2' (expected '$3')"
              fail=1
            fi
          }
          check "board dtb present" "$(test -f "$dtb" && echo yes || echo no)" yes
          # The sunxi U-Boot driver lacks A523 timing calibration on this board.
          # 1-bit/26 MHz is the only mode proven to work in BROM and U-Boot proper.
          check "mmc2 status" "$(fdtget "$dtb" /soc/mmc@4022000 status 2>&1)" okay
          check "mmc2 bus-width" "$(fdtget "$dtb" /soc/mmc@4022000 bus-width 2>&1)" 1
          check "mmc2 max-frequency" \
            "$(fdtget "$dtb" /soc/mmc@4022000 max-frequency 2>&1)" 26000000
          # The eGON.BT0 magic sits at byte 4 of the blob (byte 0 is the jump
          # instruction). 8 KiB is where it lands on the *device*, because it is
          # written with "dd seek=8", not an offset inside this file.
          check "SPL magic at file offset 4" \
            "$(dd if="$blob" bs=1 skip=4 count=8 status=none)" "eGON.BT0"
          size=$(stat -c%s "$blob")
          if [[ $size -gt 262144 && $size -lt 2097152 ]]; then
            echo "OK   blob size = $size bytes"
          else
            echo "FAIL blob size = $size bytes (expected 256 KiB..2 MiB)"
            fail=1
          fi
          if [[ $fail -ne 0 ]]; then
            echo "::error::eMMC bootloader assertions failed; not publishing the blob."
          fi
          (cd out && sha256sum u-boot-sunxi-with-spl-emmc.bin >emmc-uboot.sha256)
          cat out/emmc-uboot.sha256
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-sunxi-with-spl-emmc
          if-no-files-found: error
          retention-days: 90
          path: |
            out/u-boot-sunxi-with-spl-emmc.bin
            out/emmc-uboot.sha256
            out/emmc-uboot.config
            out/source.sha256
