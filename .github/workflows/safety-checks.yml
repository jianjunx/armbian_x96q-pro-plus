name: Offline safety checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tools/serial/**'
      - 'revision-v3/*emmc*'
      - 'ci/*uboot*'
      - '.github/workflows/uboot-emmc.yml'
      - '.github/workflows/safety-checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/serial -p 'test_*.py' -v
      - run: |
          shellcheck revision-v3/configure-emmc-uboot.sh revision-v3/build-emmc-uboot.sh ci/build-uboot-emmc-container.sh
